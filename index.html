<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ Eevee - Evolução Mágica ✨</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Trebuchet MS", Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 45%, #32105e 0%, #120622 42%, #020105 100%);
}

/* =========================================================
   FUNDO
========================================================= */

#background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: .15;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* =========================================================
   APP
========================================================= */

#app {
    position: relative;
    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

h1 {
    margin: 0;

    font-size: clamp(2.2rem, 6vw, 5rem);

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ffd45e,
            #ff79df,
            #72eaff,
            #ffffff
        );

    background-size: 400%;

    -webkit-background-clip: text;
    color: transparent;

    animation: rainbow 5s linear infinite;

    filter:
        drop-shadow(0 0 15px #ffffff)
        drop-shadow(0 0 40px #c94cff);
}

@keyframes rainbow {
    to {
        background-position: 400%;
    }
}

.subtitle {
    margin: 8px 0 20px;
    color: #dfccff;
}

/* =========================================================
   ÁREA DA EVOLUÇÃO
========================================================= */

#stage {
    width: min(90vw, 500px);
    height: min(65vh, 500px);

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   CÍRCULO MÁGICO
========================================================= */

.magic-circle {
    position: absolute;

    width: 330px;
    height: 330px;

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 10px white,
        0 0 30px #ff69ff,
        0 0 70px #923cff,
        inset 0 0 50px #7225d8;

    animation:
        circleRotate 8s linear infinite,
        circlePulse 2s ease-in-out infinite;
}

.magic-circle::before {
    content: "";

    position: absolute;

    inset: 25px;

    border-radius: 50%;

    border:
        2px dashed #ffb6ff;

    box-shadow:
        0 0 20px #ff7bff;

    animation: circleRotateReverse 5s linear infinite;
}

.magic-circle::after {
    content: "✦  ✧  ✦  ✧  ✦  ✧";

    position: absolute;

    inset: 75px;

    border-radius: 50%;

    border:
        2px solid #72eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;

    font-size: 1.3rem;

    text-shadow:
        0 0 10px white,
        0 0 20px #63eaff;

    box-shadow:
        0 0 20px #63eaff,
        inset 0 0 25px #63eaff;

    animation: circleRotate 4s linear infinite;
}

@keyframes circleRotate {
    to {
        transform: rotate(360deg);
    }
}

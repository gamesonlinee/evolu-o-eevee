<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ Evolução Mágica da Eevee ✨</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at center,
            #40106d 0%,
            #160625 45%,
            #030107 100%
        );
}


/* =========================================================
   FUNDO
========================================================= */

#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 15px #c56cff;

    animation:
        starBlink 1.5s infinite alternate;
}

@keyframes starBlink {

    from {
        opacity: .1;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }

}


/* =========================================================
   TELA
========================================================= */

#app {

    position: relative;
    z-index: 5;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;
}

h1 {

    margin: 0;

    font-size: clamp(
        2.2rem,
        7vw,
        5rem
    );

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffe16b,
            #ff75dd,
            #72eaff,
            #fff
        );

    background-size: 400%;

    -webkit-background-clip: text;

    color: transparent;

    animation:
        rainbow 5s linear infinite;

    filter:
        drop-shadow(0 0 15px white)
        drop-shadow(0 0 35px #c850ff);
}

@keyframes rainbow {

    to {
        background-position: 400%;
    }

}

.subtitle {

    color: #e5d2ff;

    margin:
        5px
        0
        10px;
}


/* =========================================================
   ÁREA CENTRAL
========================================================= */

#stage {

    position: relative;

    width: 430px;
    height: 430px;

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =========================================================
   CÍRCULO MÁGICO
========================================================= */

.magic {

    position: absolute;

    width: 330px;
    height: 330px;

    border-radius: 50%;

    border:
        2px solid rgba(
            255,
            255,
            255,
            .8
        );

    box-shadow:

        0 0 15px white,

        0 0 35px #d84dff,

        0 0 80px #792cff,

        inset
        0 0 50px #8c35ff;

    animation:
        magicRotate 7s linear infinite,
        magicPulse 2s ease-in-out infinite;
}

.magic::before {

    content: "";

    position: absolute;

    inset: 25px;

    border-radius: 50%;

    border:
        2px dashed #ffb7ff;

    box-shadow:
        0 0 15px #ff8cff;

    animation:
        magicReverse 4s linear infinite;
}

.magic::after {

    content: "✦  ✧  ✦  ✧";

    position: absolute;

    inset: 80px;

    border-radius: 50%;

    border:
        2px solid #72eaff;

    display: flex;

    justify-content: center;
    align-items: center;

    color: white;

    font-size: 25px;

    box-shadow:
        0 0 20px #5beaff;
